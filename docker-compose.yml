services:
  app:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        VITE_FILING_ICP_TEXT: ${VITE_FILING_ICP_TEXT:-}
        VITE_FILING_ICP_URL: ${VITE_FILING_ICP_URL:-}
        VITE_FILING_PSB_TEXT: ${VITE_FILING_PSB_TEXT:-}
        VITE_FILING_PSB_URL: ${VITE_FILING_PSB_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${DOCKER_APP_URL:-http://localhost:4157}
      APP_LISTEN_PORT: ${APP_PORT:-4157}
      DB_HOST: ${DOCKER_DB_HOST:-127.0.0.1}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-127.0.0.1}
    network_mode: host
    volumes:
      - type: bind
        source: ${ACTIVITY_FILES_PATH:-./storage/files/activity}
        target: /var/www/html/storage/files/activity
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${APP_LISTEN_PORT:-4157}/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
