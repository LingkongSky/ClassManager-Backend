services:
  app:
    build:
      context: .
      args:
        VITE_FILING_ICP_TEXT: ${VITE_FILING_ICP_TEXT:-}
        VITE_FILING_ICP_URL: ${VITE_FILING_ICP_URL:-}
        VITE_FILING_PSB_TEXT: ${VITE_FILING_PSB_TEXT:-}
        VITE_FILING_PSB_URL: ${VITE_FILING_PSB_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ${ACTIVITY_FILES_PATH:-./storage/files/activity}
        target: /var/www/html/storage/files/activity
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
